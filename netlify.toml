# Sitio estático: no necesita compilarse.
[build]
  publish = "."

# Atajos al panel
[[redirects]]
  from = "/admin"
  to = "/entrar/"
  status = 301
[[redirects]]
  from = "/admin/*"
  to = "/entrar/"
  status = 301

# El contenido se revisa en cada visita para que tus cambios se vean rápido
[[headers]]
  for = "/contenido/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/entrar/*"
  [headers.values]
    X-Robots-Tag = "noindex"
