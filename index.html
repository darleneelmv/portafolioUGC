<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14040a">
<title>Darlyn Lova · UGC Creator MX</title>
<meta name="description" content="UGC Creator en México. Beauty, fitness y lifestyle. Contenido real que hace brillar tu marca.">
<meta property="og:title" content="Darlyn Lova · UGC Creator MX">
<meta property="og:description" content="UGC Creator en México. Beauty, fitness y lifestyle.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="sin-js cargando">
<div class="grano" aria-hidden="true"></div>
<div class="brillo" aria-hidden="true"></div>

<header class="barra" id="barra">
  <a class="logo" href="#inicio" id="logo"></a>
  <nav aria-label="Secciones"><ul class="menu" id="menu"></ul></nav>
  <a class="btn btn-rojo btn-chico" href="#contacto" id="btn-barra"></a>
</header>

<main>
<!-- ================= PORTADA ================= -->
<section class="hero" id="inicio">
  <span class="destello" style="left:8%;top:22%;font-size:22px">✦</span>
  <span class="destello" style="left:46%;top:16%;font-size:14px;animation-delay:-2s">✦</span>
  <span class="destello" style="right:6%;top:78%;font-size:18px;animation-delay:-4s">✦</span>
  <span class="destello" style="left:38%;bottom:16%;font-size:12px;animation-delay:-1s">✦</span>
  <div class="hero-grid">
    <div class="hero-texto">
      <span class="etiqueta intro" id="h-etiqueta"></span>
      <h1 class="intro" id="h-nombre"><span class="l1"></span><span class="l2 leo-texto"></span></h1>
      <p class="sub intro" id="h-frase"></p>
      <ul class="chips intro" id="h-temas" aria-label="Temas"></ul>
      <div class="cta intro">
        <a class="btn btn-rojo magnetico" href="#portafolio"><span id="h-btn1"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <a class="btn btn-borde magnetico" href="#contacto" id="h-btn2"></a>
      </div>
      <div class="stats intro" id="stats"></div>
    </div>
    <div class="retrato intro">
      <div class="marco" id="marco"><div class="marco-in" id="foto-principal"></div></div>
      <div class="sello" aria-hidden="true">
        <svg viewBox="0 0 150 150"><defs><path id="circ" d="M75,75 m-56,0 a56,56 0 1,1 112,0 a56,56 0 1,1 -112,0"/></defs>
          <text><textPath href="#circ" id="sello-texto"></textPath></text></svg>
        <span class="centro" id="sello-iniciales"></span>
      </div>
    </div>
  </div>
  <a class="bajar" href="#sobre">Desliza<i></i></a>
</section>

<div class="cinta" aria-hidden="true"><div class="cinta-pista" id="cinta1"></div></div>
<div class="cinta leo" aria-hidden="true"><div class="cinta-pista" id="cinta2"></div></div>

<!-- ================= SOBRE MÍ ================= -->
<section class="sobre" id="sobre">
  <div class="ancho sobre-grid">
    <div class="polaroids rev" id="polaroids"></div>
    <div class="sobre-texto">
      <div class="titulo rev"><span class="etiqueta" id="s-etiqueta"></span><h2 id="s-titulo"></h2></div>
      <div id="s-parrafos"></div>
      <div class="datos rev d3" id="datos"></div>
    </div>
  </div>
</section>

<!-- ================= PORTAFOLIO ================= -->
<section class="portafolio" id="portafolio">
  <div class="ancho">
    <div class="titulo centrado rev"><span class="etiqueta" id="p-etiqueta"></span><h2 id="p-titulo"></h2><p id="p-sub"></p></div>
    <nav class="sectores rev d1" id="sectores" aria-label="Secciones del portafolio"></nav>
    <div id="bloques"></div>
  </div>
</section>

<!-- ================= SERVICIOS ================= -->
<section class="servicios" id="servicios">
  <div class="ancho">
    <div class="titulo rev"><span class="etiqueta" id="sv-etiqueta"></span><h2 id="sv-titulo"></h2><p id="sv-sub"></p></div>
    <div class="cartas" id="cartas"></div>
  </div>
</section>

<!-- ================= POR QUÉ YO ================= -->
<section class="porque" id="porque">
  <div class="ancho">
    <div class="cita rev">
      <span class="comillas" aria-hidden="true">“</span>
      <blockquote id="cita"></blockquote>
    </div>
    <div class="razones" id="razones"></div>
  </div>
</section>

<!-- ================= PROCESO ================= -->
<section class="proceso" id="proceso">
  <div class="ancho">
    <div class="titulo centrado rev"><span class="etiqueta" id="pr-etiqueta"></span><h2 id="pr-titulo"></h2></div>
    <div class="pasos" id="pasos"></div>
  </div>
</section>

<!-- ================= MARCAS ================= -->
<section class="marcas" id="marcas">
  <div class="ancho">
    <div class="titulo centrado rev"><span class="etiqueta" id="m-etiqueta"></span><h2 id="m-titulo"></h2></div>
    <div id="logos" class="rev d1"></div>
  </div>
</section>

<!-- ================= CONTACTO ================= -->
<section class="contacto" id="contacto">
  <div class="ancho">
    <span class="etiqueta rev" id="c-etiqueta"></span>
    <h2 class="rev d1" id="c-titulo"></h2>
    <p class="sub rev d2" id="c-sub"></p>
    <div class="correo rev d3">
      <span id="correo-texto"></span>
      <button class="btn btn-rojo btn-chico" id="copiar" type="button">Copiar correo</button>
      <a class="btn btn-borde btn-chico" id="escribir" href="#">Escribirme</a>
    </div>
    <div class="redes rev d4" id="redes"></div>
  </div>
</section>
</main>

<footer>
  <a class="logo" href="#inicio" id="logo-pie"></a>
  <span id="pie"></span>
</footer>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="/js/sitio.js" defer></script>
</body>
</html>
